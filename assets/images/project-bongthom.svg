<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Go and Fiber">
    <defs>
        <linearGradient id="bt-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0c0f12"/>
            <stop offset="1" stop-color="#05070a"/>
        </linearGradient>
        <radialGradient id="bt-glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#00ADD8" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#00ADD8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bt-strand" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#00ADD8" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#00ADD8" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#00ADD8" stop-opacity="0"/>
        </linearGradient>
        <pattern id="bt-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
        </pattern>
        <style>
            .m { font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; }
        </style>
    </defs>

    <rect width="800" height="500" fill="url(#bt-bg)"/>
    <rect width="800" height="500" fill="url(#bt-grid)"/>
    <ellipse cx="400" cy="330" rx="330" ry="210" fill="url(#bt-glow)"/>

    <!-- the fibres: strands running past the wordmark, for the framework
         whose whole pitch is speed -->
    <g fill="none" stroke="url(#bt-strand)" stroke-linecap="round">
        <path d="M40 200 C 240 150, 560 250, 760 190" stroke-width="2" opacity="0.55"/>
        <path d="M40 240 C 260 300, 540 160, 760 230" stroke-width="1.5" opacity="0.4"/>
        <path d="M40 430 C 250 470, 550 380, 760 440" stroke-width="2" opacity="0.5"/>
        <path d="M40 465 C 260 420, 520 500, 760 410" stroke-width="1.5" opacity="0.32"/>
    </g>

    <!-- the Go gopher's blue, as the one colour on an otherwise noir card.
         The two words are given their widths outright, so the lockup is
         centred on the whole wordmark — not on the dot between them —
         whatever font the machine ends up using. -->
    <g class="m" font-size="92" font-weight="700">
        <text x="163" y="326" fill="#00ADD8" textLength="110" lengthAdjust="spacingAndGlyphs">Go</text>
        <text x="361" y="326" fill="#ffffff" textLength="276" lengthAdjust="spacingAndGlyphs">Fiber</text>
    </g>
    <circle cx="317" cy="296" r="6" fill="#4a4a52"/>
    <text class="m" x="400" y="374" font-size="15" fill="#7a7a80" letter-spacing="7" text-anchor="middle">BACKEND</text>

    <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
